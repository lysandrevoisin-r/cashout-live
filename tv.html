<title>Cash Out TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700&family=JetBrains+Mono:wght@700&display=swap">

<style>
:root{--bg:#000;--card:#0d0d0d;--border:#1a1a1a;--fg:#fff;--muted:#444;--green:#1db954;--red:#ff3b3b;--gold:#f5c842;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;padding:.5em 1.5em;border-bottom:1px solid var(--border);background:#050505}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2rem,4vw,3.5rem);letter-spacing:.25em;color:var(--green)}
.clock{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2rem,4vw,3.5rem);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.live{display:flex;align-items:center;gap:6px;font-size:.65rem;letter-spacing:.15em;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.dot.on{background:var(--green)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6em;padding:.8em 1em;overflow-y:auto;align-content:start}
.drink-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9em 1.1em;display:flex;flex-direction:column;gap:.5em;transition:border-color .4s}
.drink-card.down{border-color:rgba(255,59,59,.4)}.drink-card.up{border-color:rgba(29,185,84,.3)}
.dc-name{font-weight:700;font-size:clamp(.85rem,1.5vw,1.1rem);color:#ccc}
.dc-price{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2.2rem,4.5vw,4rem);letter-spacing:.03em;font-variant-numeric:tabular-nums;line-height:1;transition:color .5s}
.dc-price.up{color:var(--green)}.dc-price.down{color:var(--red)}.dc-price.norm{color:var(--fg)}
.dc-footer{display:flex;justify-content:space-between;align-items:center}
.dc-range{font-family:'JetBrains Mono',monospace;font-size:clamp(.6rem,1vw,.75rem);color:var(--muted)}
.dc-badge{font-family:'JetBrains Mono',monospace;font-size:clamp(.7rem,1.2vw,.85rem);font-weight:700;padding:.15em .5em;border-radius:4px}
.dc-badge.up{background:rgba(29,185,84,.15);color:var(--green)}.dc-badge.down{background:rgba(255,59,59,.15);color:var(--red)}.dc-badge.norm{background:rgba(255,255,255,.05);color:var(--muted)}
.dc-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.dc-fill{height:100%;border-radius:2px;transition:width .8s ease,background .5s}
#overlay{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .6s;gap:.3em}
#overlay.show{opacity:1;pointer-events:auto}
.ov-title{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(5rem,14vw,12rem);letter-spacing:.12em;color:var(--red);animation:pulse .5s infinite alternate}
.ov-sub{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(1.2rem,3vw,2.5rem);letter-spacing:.35em;color:#fff;margin-bottom:.5em}
.ov-prices{display:flex;flex-wrap:wrap;gap:.7em;justify-content:center;max-width:min(900px,90vw)}
.ov-pill{border:1px solid var(--red);border-radius:8px;padding:.5em 1.1em;text-align:center;background:rgba(255,59,59,.08)}
.ov-pill-name{font-size:clamp(.6rem,1.2vw,.8rem);color:#888}
.ov-pill-price{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(1.5rem,3vw,2.5rem);color:var(--red);font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--border);background:#050505;padding:.35em 0;overflow:hidden;white-space:nowrap}
.ticker{display:inline-block;animation:scroll 50s linear infinite}
.ti{display:inline-block;margin:0 2em;font-family:'JetBrains Mono',monospace;font-size:clamp(.65rem,1.2vw,.85rem)}
.ti-name{color:var(--muted)}.ti-price{color:var(--fg);margin:0 .4em;font-variant-numeric:tabular-nums}
.ti-up{color:var(--green)}.ti-down{color:var(--red)}
@keyframes blink{50%{opacity:.15}}
@keyframes pulse{to{opacity:.35}}
@keyframes scroll{to{transform:translateX(-50%)}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

<div class="app">
  <header>
    <div class="logo">DELIRIUM</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="live"><div class="dot" id="dot"></div> LIVE</div>
  </header>
  <div class="board" id="board"></div>
  <footer><div class="ticker" id="ticker"></div></footer>
</div>

<div id="overlay">
  <div class="ov-title">CRASH !</div>
  <div class="ov-sub">LES PRIX S'EFFONDRENT</div>
  <div class="ov-prices" id="ov-prices"></div>
</div>

<script>
var SUPA_URL = 'https://cbmxbbmgovecjtjvxwjm.supabase.co';
var SUPA_KEY = 'sb_publishable_sxgrjKa7zjGa67uEMs9ZwA_VtzB1d5d';
var TOPIC = 'cashout-live';

var drinks = [
  { id:'beer25',   name:'Biere pression 25cl', normal:3.00,  low:2.00,  high:4.00  },
  { id:'beer50',   name:'Biere pression 50cl', normal:5.00,  low:3.50,  high:6.50  },
  { id:'shot',     name:'Shot simple',          normal:2.50,  low:1.50,  high:3.50  },
  { id:'shotprem', name:'Shot premium',         normal:3.50,  low:2.50,  high:5.00  },
  { id:'cocktail', name:'Cocktail classique',   normal:7.00,  low:5.00,  high:9.00  },
  { id:'cocksign', name:'Cocktail signature',   normal:9.50,  low:7.00,  high:12.00 },
  { id:'soft',     name:'Eau / Soda',           normal:2.00,  low:1.50,  high:3.00  },
  { id:'vodka',    name:'Vodka 70cl',           normal:70.00, low:55.00, high:85.00 },
  { id:'champ',    name:'Champagne',            normal:60.00, low:45.00, high:75.00 }
];
var prices = {};

function initPrices() {
  for (var i = 0; i < drinks.length; i++) {
    if (!prices[drinks[i].id]) prices[drinks[i].id] = drinks[i].normal;
  }
}

function renderBoard() {
  var board = document.getElementById('board');
  board.innerHTML = '';
  for (var i = 0; i < drinks.length; i++) {
    var d = drinks[i];
    var cur = prices[d.id] !== undefined ? prices[d.id] : d.normal;
    var pct = (cur - d.normal) / d.normal * 100;
    var dir = cur > d.normal + 0.01 ? 'up' : cur < d.normal - 0.01 ? 'down' : 'norm';
    var fillPct = Math.max(0, Math.min(100, (cur - d.low) / (d.high - d.low) * 100));
    var fillColor = dir === 'down' ? 'var(--red)' : dir === 'up' ? 'var(--green)' : 'var(--gold)';
    var card = document.createElement('div');
    card.className = 'drink-card ' + dir;
    card.id = 'card-' + d.id;
    card.innerHTML = '<div class="dc-name">' + d.name + '</div>'
      + '<div class="dc-price ' + dir + '" id="price-' + d.id + '">' + cur.toFixed(2) + ' EUR</div>'
      + '<div class="dc-bar"><div class="dc-fill" style="width:' + fillPct + '%;background:' + fillColor + '"></div></div>'
      + '<div class="dc-footer">'
      + '<div class="dc-range">&#9660;' + d.low.toFixed(2) + ' &#8212; &#9650;' + d.high.toFixed(2) + '</div>'
      + '<div class="dc-badge ' + dir + '">' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%</div>'
      + '</div>';
    board.appendChild(card);
  }
  renderTicker();
}

function applyPrices() {
  for (var i = 0; i < drinks.length; i++) {
    var d = drinks[i];
    var cur = prices[d.id] !== undefined ? prices[d.id] : d.normal;
    var pct = (cur - d.normal) / d.normal * 100;
    var dir = cur > d.normal + 0.01 ? 'up' : cur < d.normal - 0.01 ? 'down' : 'norm';
    var fillPct = Math.max(0, Math.min(100, (cur - d.low) / (d.high - d.low) * 100));
    var fillColor = dir === 'down' ? 'var(--red)' : dir === 'up' ? 'var(--green)' : 'var(--gold)';
    var card = document.getElementById('card-' + d.id);
    if (!card) continue;
    card.className = 'drink-card ' + dir;
    var pel = document.getElementById('price-' + d.id);
    if (pel) { pel.textContent = cur.toFixed(2) + ' EUR'; pel.className = 'dc-price ' + dir; }
    var fill = card.querySelector('.dc-fill');
    if (fill) { fill.style.width = fillPct + '%'; fill.style.background = fillColor; }
    var badge = card.querySelector('.dc-badge');
    if (badge) { badge.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%'; badge.className = 'dc-badge ' + dir; }
  }
  renderTicker();
}

function renderTicker() {
  var items = '';
  for (var i = 0; i < drinks.length; i++) {
    var d = drinks[i];
    var cur = prices[d.id] !== undefined ? prices[d.id] : d.normal;
    var pct = (cur - d.normal) / d.normal * 100;
    var dir = pct > 0.1 ? 'up' : pct < -0.1 ? 'down' : 'muted';
    var arrow = pct > 0.1 ? '&#9650;' : pct < -0.1 ? '&#9660;' : '&#8212;';
    items += '<span class="ti"><span class="ti-name">' + d.name.toUpperCase() + '</span>'
      + '<span class="ti-price">' + cur.toFixed(2) + 'EUR</span>'
      + '<span class="ti-' + dir + '">' + arrow + Math.abs(pct).toFixed(1) + '%</span></span>';
  }
  document.getElementById('ticker').innerHTML = items + items;
}

function showCrash(crashedIds) {
  var pills = '';
  for (var i = 0; i < drinks.length; i++) {
    var d = drinks[i];
    if (!crashedIds[d.id]) continue;
    pills += '<div class="ov-pill"><div class="ov-pill-name">' + d.name + '</div>'
      + '<div class="ov-pill-price">' + prices[d.id].toFixed(2) + ' EUR</div></div>';
  }
  document.getElementById('ov-prices').innerHTML = pills;
  document.getElementById('overlay').classList.add('show');
}

function hideCrash() {
  document.getElementById('overlay').classList.remove('show');
}

function tickClock() {
  var now = new Date();
  document.getElementById('clock').textContent =
    now.getHours().toString().padStart(2,'0') + ':' +
    now.getMinutes().toString().padStart(2,'0') + ':' +
    now.getSeconds().toString().padStart(2,'0');
}

var client  = supabase.createClient(SUPA_URL, SUPA_KEY);
var channel = client.channel(TOPIC);

channel
  .on('broadcast', { event: 'drinks' }, function(msg) {
    drinks = msg.payload.drinks;
    prices = {};
    initPrices();
    renderBoard();
    hideCrash();
  })
  .on('broadcast', { event: 'crash' }, function(msg) {
    var data = msg.payload;
    for (var k in data.prices) prices[k] = data.prices[k];
    applyPrices();
    var crashedMap = {};
    var ids = data.ids || Object.keys(data.prices);
    for (var i = 0; i < ids.length; i++) crashedMap[ids[i]] = true;
    showCrash(crashedMap);
  })
  .on('broadcast', { event: 'recover' }, function(msg) {
    var data = msg.payload;
    for (var k in data.prices) prices[k] = data.prices[k];
    applyPrices();
    hideCrash();
  })
  .subscribe(function(status) {
    if (status === 'SUBSCRIBED') {
      document.getElementById('dot').classList.add('on');
    } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
      document.getElementById('dot').classList.remove('on');
    }
  });

initPrices();
renderBoard();
setInterval(tickClock, 1000);
tickClock();
</script>
