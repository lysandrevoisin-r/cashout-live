<title>BAR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700&family=JetBrains+Mono:wght@700&display=swap">
<script src="https://unpkg.com/ably@2.6.1/build/ably.min.js"></script>

<style>
:root {
  --bg:     #000;
  --card:   #0d0d0d;
  --border: #1a1a1a;
  --fg:     #fff;
  --muted:  #444;
  --green:  #1db954;
  --red:    #ff3b3b;
  --gold:   #f5c842;
  --font-d: 'Bebas Neue', Impact, sans-serif;
  --font-b: 'Inter', system-ui, sans-serif;
  --font-m: 'JetBrains Mono', monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-b); overflow: hidden; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* HEADER */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5em 1.5em;
  border-bottom: 1px solid var(--border);
  background: #050505;
}
.logo { font-family: var(--font-d); font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: 0.25em; color: var(--green); }
.header-center { display: flex; flex-direction: column; align-items: center; gap: 0.1em; }
.crash-timer-label { font-size: clamp(0.55rem, 1vw, 0.8rem); letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; }
.crash-timer {
  font-family: var(--font-d); font-size: clamp(2rem, 5vw, 4.5rem);
  letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
  color: var(--green); transition: color 0.3s;
}
.crash-timer.warn   { color: var(--gold); }
.crash-timer.danger { color: var(--red); animation: flicker 0.4s infinite alternate; }
.clock { font-family: var(--font-d); font-size: clamp(1.5rem, 3vw, 2.8rem); letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
.live { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; letter-spacing: 0.15em; color: var(--muted); margin-top: 2px; justify-content: flex-end; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1s infinite; }

/* BOARD */
.board {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0.6em;
  padding: 0.8em 1em;
  overflow-y: auto;
  align-content: start;
}

.drink-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.9em 1.1em;
  display: flex; flex-direction: column; gap: 0.5em;
  transition: border-color 0.4s;
}
.drink-card.down { border-color: rgba(255,59,59,0.4); }
.drink-card.up   { border-color: rgba(29,185,84,0.3); }

.dc-name { font-weight: 700; font-size: clamp(0.85rem, 1.5vw, 1.1rem); color: #ccc; }
.dc-price {
  font-family: var(--font-d); font-size: clamp(2.2rem, 4.5vw, 4rem);
  letter-spacing: 0.03em; font-variant-numeric: tabular-nums; line-height: 1;
  transition: color 0.5s;
}
.dc-price.up   { color: var(--green); }
.dc-price.down { color: var(--red); }
.dc-price.norm { color: var(--fg); }

.dc-footer { display: flex; justify-content: space-between; align-items: center; }
.dc-range { font-family: var(--font-m); font-size: clamp(0.6rem, 1vw, 0.75rem); color: var(--muted); }
.dc-badge {
  font-family: var(--font-m); font-size: clamp(0.7rem, 1.2vw, 0.85rem); font-weight: 700;
  padding: 0.15em 0.5em; border-radius: 4px;
}
.dc-badge.up   { background: rgba(29,185,84,0.15); color: var(--green); }
.dc-badge.down { background: rgba(255,59,59,0.15); color: var(--red); }
.dc-badge.norm { background: rgba(255,255,255,0.05); color: var(--muted); }

/* BAR */
.dc-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.dc-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease, background 0.5s; }

/* CRASH OVERLAY */
#overlay {
  position: fixed; inset: 0; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.6s;
  gap: 0.3em;
}
#overlay.show { opacity: 1; pointer-events: auto; }
.ov-icon  { font-size: clamp(5rem, 12vw, 9rem); }
.ov-title {
  font-family: var(--font-d); font-size: clamp(5rem, 14vw, 12rem);
  letter-spacing: 0.12em; color: var(--red);
  animation: pulse 0.5s infinite alternate;
}
.ov-sub { font-family: var(--font-d); font-size: clamp(1.2rem, 3vw, 2.5rem); letter-spacing: 0.35em; color: #fff; margin-bottom: 0.5em; }
.ov-prices {
  display: flex; flex-wrap: wrap; gap: 0.7em; justify-content: center;
  max-width: min(900px, 90vw);
}
.ov-pill {
  border: 1px solid var(--red); border-radius: 8px;
  padding: 0.5em 1.1em; text-align: center;
  background: rgba(255,59,59,0.08);
}
.ov-pill-name { font-size: clamp(0.6rem, 1.2vw, 0.8rem); color: #888; }
.ov-pill-price { font-family: var(--font-d); font-size: clamp(1.5rem, 3vw, 2.5rem); color: var(--red); font-variant-numeric: tabular-nums; }

/* FOOTER TICKER */
footer {
  border-top: 1px solid var(--border); background: #050505;
  padding: 0.35em 0; overflow: hidden; white-space: nowrap;
}
.ticker { display: inline-block; animation: scroll 50s linear infinite; }
.ti { display: inline-block; margin: 0 2em; font-family: var(--font-m); font-size: clamp(0.65rem, 1.2vw, 0.85rem); }
.ti-name { color: var(--muted); }
.ti-price { color: var(--fg); margin: 0 0.4em; font-variant-numeric: tabular-nums; }
.ti-up   { color: var(--green); }
.ti-down { color: var(--red); }

/* ANIMATIONS */
@keyframes blink   { 50% { opacity: 0.15; } }
@keyframes pulse   { to  { opacity: 0.35; } }
@keyframes scroll  { to  { transform: translateX(-50%); } }
@keyframes flicker { to  { opacity: 0.6; } }
</style>

<div class="app">
  <header>
    <div class="logo">CASH OUT</div>
    <div class="header-center">
      <div class="crash-timer-label">Prochain crash dans</div>
      <div class="crash-timer" id="countdown">20:00</div>
    </div>
    <div style="text-align:right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="live"><div class="dot"></div> LIVE</div>
    </div>
  </header>

  <div class="board" id="board"></div>

  <footer><div class="ticker" id="ticker"></div></footer>
</div>

<!-- CRASH OVERLAY -->
<div id="overlay">
  <div class="ov-icon">📉</div>
  <div class="ov-title">CRASH !</div>
  <div class="ov-sub">LES PRIX S'EFFONDRENT</div>
  <div class="ov-prices" id="ov-prices"></div>
</div>

<script>
const ABLY_KEY = 'HWuUIA.loF4hQ:iTHcx2k-CWoN-1eL0cK2BVVHPHqYHCxb5YJf7Xr6Yro';
const CHANNEL  = 'cashout-live';

// Default drinks (overwritten by admin)
let drinks = [
  { id:'beer25',   cat:'🍺 Bières',     name:'Bière pression 25cl', normal:3.00, low:2.00, high:4.00 },
  { id:'beer50',   cat:'🍺 Bières',     name:'Bière pression 50cl', normal:5.00, low:3.50, high:6.50 },
  { id:'shot',     cat:'🥃 Shots',      name:'Shot simple',          normal:2.50, low:1.50, high:3.50 },
  { id:'shotprem', cat:'🥃 Shots',      name:'Shot premium',         normal:3.50, low:2.50, high:5.00 },
  { id:'cocktail', cat:'🍹 Cocktails',  name:'Cocktail classique',   normal:7.00, low:5.00, high:9.00 },
  { id:'cocksign', cat:'🍹 Cocktails',  name:'Cocktail signature',   normal:9.50, low:7.00, high:12.00 },
  { id:'soft',     cat:'🥤 Softs',      name:'Eau / Soda',           normal:2.00, low:1.50, high:3.00 },
  { id:'vodka',    cat:'🍾 Bouteilles', name:'Vodka (70cl)',          normal:70.00,low:55.00,high:85.00 },
  { id:'champ',    cat:'🍾 Bouteilles', name:'Champagne',            normal:60.00,low:45.00,high:75.00 },
];
let prices = {};
let crashed = false;

function initPrices() { drinks.forEach(d => { if (!prices[d.id]) prices[d.id] = d.normal; }); }

// ── BOARD ──
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  drinks.forEach(d => {
    const cur = prices[d.id] ?? d.normal;
    const pct = (cur - d.normal) / d.normal * 100;
    const dir = cur > d.normal + 0.01 ? 'up' : cur < d.normal - 0.01 ? 'down' : 'norm';
    const fillPct = Math.max(0, Math.min(100, (cur - d.low) / (d.high - d.low) * 100));
    const fillColor = dir === 'down' ? 'var(--red)' : dir === 'up' ? 'var(--green)' : 'var(--gold)';
    const card = document.createElement('div');
    card.className = 'drink-card ' + dir;
    card.id = 'card-' + d.id;
    card.innerHTML = `
      <div class="dc-name">${d.name}</div>
      <div class="dc-price ${dir}" id="price-${d.id}">${cur.toFixed(2)} €</div>
      <div class="dc-bar"><div class="dc-fill" style="width:${fillPct}%;background:${fillColor}"></div></div>
      <div class="dc-footer">
        <div class="dc-range">▼${d.low.toFixed(2)} — ▲${d.high.toFixed(2)}</div>
        <div class="dc-badge ${dir}">${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%</div>
      </div>`;
    board.appendChild(card);
  });
  renderTicker();
}

function applyPrices() {
  drinks.forEach(d => {
    const cur = prices[d.id] ?? d.normal;
    const pct = (cur - d.normal) / d.normal * 100;
    const dir = cur > d.normal + 0.01 ? 'up' : cur < d.normal - 0.01 ? 'down' : 'norm';
    const fillPct = Math.max(0, Math.min(100, (cur - d.low) / (d.high - d.low) * 100));
    const fillColor = dir === 'down' ? 'var(--red)' : dir === 'up' ? 'var(--green)' : 'var(--gold)';
    const card = document.getElementById('card-' + d.id);
    if (!card) return;
    card.className = 'drink-card ' + dir;
    const pel = document.getElementById('price-' + d.id);
    if (pel) { pel.textContent = cur.toFixed(2) + ' €'; pel.className = 'dc-price ' + dir; }
    const fill = card.querySelector('.dc-fill');
    if (fill) { fill.style.width = fillPct + '%'; fill.style.background = fillColor; }
    const badge = card.querySelector('.dc-badge');
    if (badge) { badge.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%'; badge.className = 'dc-badge ' + dir; }
  });
  renderTicker();
}

// ── TICKER ──
function renderTicker() {
  const items = drinks.map(d => {
    const cur = prices[d.id] ?? d.normal;
    const pct = (cur - d.normal) / d.normal * 100;
    const dir = pct > 0.1 ? 'up' : pct < -0.1 ? 'down' : 'muted';
    const arrow = pct > 0.1 ? '▲' : pct < -0.1 ? '▼' : '—';
    return `<span class="ti"><span class="ti-name">${d.name.toUpperCase()}</span><span class="ti-price">${cur.toFixed(2)}€</span><span class="ti-${dir}">${arrow}${Math.abs(pct).toFixed(1)}%</span></span>`;
  }).join('');
  document.getElementById('ticker').innerHTML = items + items;
}

// ── CRASH OVERLAY ──
function showCrash() {
  crashed = true;
  document.getElementById('ov-prices').innerHTML = drinks.map(d =>
    `<div class="ov-pill"><div class="ov-pill-name">${d.name}</div><div class="ov-pill-price">${(prices[d.id] ?? d.low).toFixed(2)} €</div></div>`
  ).join('');
  document.getElementById('overlay').classList.add('show');
}
function hideCrash() {
  crashed = false;
  document.getElementById('overlay').classList.remove('show');
}

// ── CLOCK & COUNTDOWN ──
let remaining = 20 * 60;
function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.getHours().toString().padStart(2,'0') + ':' +
    now.getMinutes().toString().padStart(2,'0') + ':' +
    now.getSeconds().toString().padStart(2,'0');
  const el = document.getElementById('countdown');
  if (!crashed) {
    const m = Math.floor(remaining / 60).toString().padStart(2,'0');
    const s = (remaining % 60).toString().padStart(2,'0');
    el.textContent = m + ':' + s;
    el.className = 'crash-timer' + (remaining <= 60 ? ' crash' : remaining <= 180 ? ' warn' : '');
    if (remaining > 0) remaining--;
  }
}

// ── ABLY ──
const ably = new Ably.Realtime({ key: ABLY_KEY });
const ch   = ably.channels.get(CHANNEL);

ch.subscribe(msg => {
  const { event, data } = msg.data;

  if (event === 'prices') {
    prices = { ...prices, ...data.prices };
    if (data.drinks) { drinks = data.drinks; renderBoard(); }
    else applyPrices();
  }
  if (event === 'crash') {
    prices = { ...prices, ...data.prices };
    applyPrices();
    showCrash();
  }
  if (event === 'recover') {
    prices = { ...prices, ...data.prices };
    applyPrices();
    hideCrash();
    remaining = 20 * 60;
  }
  if (event === 'timer') {
    remaining = data.remaining;
  }
});

// ── INIT ──
initPrices();
renderBoard();
setInterval(tickClock, 1000);
tickClock();
</script>
