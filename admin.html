<title>Delirium Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">

<style>
:root{--bg:#0a0a0a;--surface:#111;--card:#161616;--border:#252525;--fg:#fff;--muted:#555;--green:#1db954;--red:#ff3b3b;--gold:#f5c842;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.7em 1em;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.8rem;letter-spacing:.2em;color:var(--green)}
.conn{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.conn.ok{color:var(--green)}.conn.wait{color:var(--gold)}.conn.err{color:var(--red)}
.page{padding:1em;display:flex;flex-direction:column;gap:1.2em;max-width:540px;margin:0 auto}
.sec-title{font-size:.65rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:.6em}
.drink-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.85em 1em;display:flex;align-items:center;gap:.8em;margin-bottom:.5em;cursor:pointer;transition:border-color .2s,background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.drink-row.sel{border-color:var(--red);background:rgba(255,59,59,.08)}
.drink-row.crashed{border-color:var(--red);background:rgba(255,59,59,.15)}
.dr-check{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.drink-row.sel .dr-check,.drink-row.crashed .dr-check{background:var(--red);border-color:var(--red);color:#fff}
.dr-name{flex:1;font-weight:600;font-size:.9rem}
.dr-prices{text-align:right}
.dr-normal{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.6rem;line-height:1}
.dr-low{font-size:.7rem;color:var(--red);margin-top:2px}
.dr-badge{font-size:.65rem;background:rgba(255,59,59,.2);color:var(--red);padding:.15em .5em;border-radius:4px;display:none}
.drink-row.crashed .dr-badge{display:inline-block}
.action-zone{display:flex;flex-direction:column;gap:.7em}
.btn-big{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.1em;padding:.9em 1em;border:none;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1em;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:100%;transition:opacity .15s,transform .1s}
.btn-big:active{opacity:.7;transform:scale(.98)}
.btn-big .label{font-size:1.8rem}
.btn-big small{font-size:.65rem;font-family:Inter,system-ui,sans-serif;opacity:.75}
.btn-crash{background:var(--red);color:#fff}.btn-recover{background:var(--green);color:#000}
.btn-crash:disabled{opacity:.35;cursor:not-allowed;transform:none}
.select-hint{font-size:.75rem;color:var(--muted);text-align:center;padding:.5em 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.3em;width:min(460px,94vw);max-height:85vh;overflow-y:auto}
.modal h2{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.4rem;letter-spacing:.1em;color:var(--green);margin-bottom:.8em}
.edit-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.4em;align-items:end;margin-bottom:.5em}
.field label{display:block;font-size:.6rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.25em}
.field input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--fg);font-size:.85rem;padding:.4em .6em;border-radius:5px}
.field input:focus{outline:none;border-color:var(--green)}
.btn-del{background:none;border:none;color:var(--red);font-size:1.1rem;cursor:pointer;padding:.4em}
.btn-add{background:none;border:1px dashed var(--border);color:var(--muted);width:100%;padding:.5em;border-radius:6px;cursor:pointer;margin:.4em 0 .8em;font-size:.85rem}
.modal-footer{display:flex;gap:.6em}
.btn-save{background:var(--green);color:#000;font-family:'Bebas Neue',Impact,sans-serif;font-size:1rem;letter-spacing:.1em;padding:.55em 1.2em;border:none;border-radius:6px;cursor:pointer;flex:1}
.btn-cancel{background:var(--border);color:var(--muted);font-family:'Bebas Neue',Impact,sans-serif;font-size:1rem;letter-spacing:.1em;padding:.55em 1.2em;border:none;border-radius:6px;cursor:pointer}
.btn-edit{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--fg);font-family:'Bebas Neue',Impact,sans-serif;font-size:1rem;letter-spacing:.1em;padding:.6em;border-radius:8px;cursor:pointer}
#toast{position:fixed;bottom:1.5em;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--fg);font-size:.85rem;padding:.6em 1.2em;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:99}
#toast.show{opacity:1}
</style>

<header>
  <div class="logo">DELIRIUM</div>
  <div class="conn wait" id="conn">Connexion...</div>
</header>

<div class="page">
  <div>
    <div class="sec-title">Selectionne les boissons a crasher</div>
    <div id="drink-list"></div>
    <button class="btn-edit" id="btn-edit">Modifier les boissons et prix</button>
  </div>
  <div class="action-zone">
    <div class="select-hint" id="hint">Coche des boissons pour declencher un crash</div>
    <button class="btn-big btn-crash" id="btn-crash" disabled>
      <span class="label">DECLENCHER LE CRASH</span>
      <small id="crash-sub">Selectionne des boissons</small>
    </button>
    <button class="btn-big btn-recover" id="btn-recover">
      <span class="label">ENLEVER LE CRASH</span>
      <small>Remet tous les prix normaux</small>
    </button>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2>BOISSONS</h2>
    <div id="drinks-editor"></div>
    <button class="btn-add" id="btn-add-row">+ Ajouter une boisson</button>
    <div class="modal-footer">
      <button class="btn-cancel" id="btn-cancel">Annuler</button>
      <button class="btn-save" id="btn-save-edit">ENREGISTRER</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var ABLY_KEY = 'HWuUIA.eCUdiw:BcnMlAetft08risVQk6sAV5l9wgb2Bej5wmDgzOODp4';
var CHANNEL = 'cashout-live';

var drinks = [
  { id:'beer25',   name:'Biere pression 25cl', normal:3.00,  low:2.00  },
  { id:'beer50',   name:'Biere pression 50cl', normal:5.00,  low:3.50  },
  { id:'shot',     name:'Shot simple',          normal:2.50,  low:1.50  },
  { id:'shotprem', name:'Shot premium',         normal:3.50,  low:2.50  },
  { id:'cocktail', name:'Cocktail classique',   normal:7.00,  low:5.00  },
  { id:'cocksign', name:'Cocktail signature',   normal:9.50,  low:7.00  },
  { id:'soft',     name:'Eau / Soda',           normal:2.00,  low:1.50  },
  { id:'vodka',    name:'Vodka 70cl',           normal:70.00, low:55.00 },
  { id:'champ',    name:'Champagne',            normal:60.00, low:45.00 }
];

var selected = {};
var crashed  = {};

function setConn(txt, cls) {
  var el = document.getElementById('conn');
  el.textContent = txt;
  el.className = 'conn ' + cls;
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

function publish(event, data) {
  var body = JSON.stringify([{ name:'event', data:{ event:event, data:data } }]);
  fetch('https://rest.ably.io/channels/' + encodeURIComponent(CHANNEL) + '/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Basic ' + btoa(ABLY_KEY)
    },
    body: body
  }).then(function(res) {
    if (res.ok) {
      setConn('Envoye', 'ok');
      setTimeout(function() { setConn('Connecte', 'ok'); }, 1500);
    } else {
      setConn('Erreur', 'err');
    }
  }).catch(function() {
    setConn('Pas de reseau', 'err');
  });
}

function renderList() {
  var html = '';
  for (var i = 0; i < drinks.length; i++) {
    var d = drinks[i];
    var isCrashed  = crashed[d.id]  ? true : false;
    var isSelected = selected[d.id] ? true : false;
    var cls = isCrashed ? 'crashed' : (isSelected ? 'sel' : '');
    var chk = (isCrashed || isSelected) ? 'V' : '';
    html += '<div class="drink-row ' + cls + '" data-id="' + d.id + '">'
      + '<div class="dr-check">' + chk + '</div>'
      + '<div class="dr-name">' + d.name + '</div>'
      + '<div class="dr-prices">'
      + '<div class="dr-normal">' + d.normal.toFixed(2) + ' EUR</div>'
      + '<div class="dr-low">crash > ' + d.low.toFixed(2) + ' EUR</div>'
      + '<div class="dr-badge">EN CRASH</div>'
      + '</div></div>';
  }
  document.getElementById('drink-list').innerHTML = html;
}

function updateBtn() {
  var n = Object.keys(selected).length;
  var btn = document.getElementById('btn-crash');
  var sub = document.getElementById('crash-sub');
  var hint = document.getElementById('hint');
  if (n === 0) {
    btn.disabled = true;
    sub.textContent = 'Selectionne des boissons';
    hint.textContent = 'Coche des boissons pour declencher un crash';
  } else {
    btn.disabled = false;
    sub.textContent = n + ' boisson(s) selectionnee(s)';
    hint.textContent = '';
  }
}

function toggleDrink(id) {
  if (crashed[id]) return;
  if (selected[id]) {
    delete selected[id];
  } else {
    selected[id] = true;
  }
  renderList();
  updateBtn();
}

function doCrash() {
  if (Object.keys(selected).length === 0) return;
  var prices = {};
  for (var i = 0; i < drinks.length; i++) {
    var d = drinks[i];
    if (selected[d.id]) {
      prices[d.id] = d.low;
      crashed[d.id] = true;
    } else {
      prices[d.id] = d.normal;
    }
  }
  selected = {};
  publish('crash', { prices: prices, crashedIds: Object.keys(crashed) });
  renderList();
  updateBtn();
  toast('Crash declenche !');
}

function doRecover() {
  crashed = {};
  selected = {};
  var prices = {};
  for (var i = 0; i < drinks.length; i++) {
    prices[drinks[i].id] = drinks[i].normal;
  }
  publish('recover', { prices: prices });
  renderList();
  updateBtn();
  toast('Prix normaux retablis !');
}

var editDrinks = [];

function openEdit() {
  editDrinks = JSON.parse(JSON.stringify(drinks));
  renderEditor();
  document.getElementById('modal-bg').classList.add('show');
}

function closeEdit() {
  document.getElementById('modal-bg').classList.remove('show');
}

function renderEditor() {
  var html = '';
  for (var i = 0; i < editDrinks.length; i++) {
    var d = editDrinks[i];
    html += '<div class="edit-row" data-idx="' + i + '">'
      + '<div class="field"><label>Nom</label><input class="ed-name" value="' + d.name + '"></div>'
      + '<div class="field"><label>Normal</label><input class="ed-normal" type="number" step="0.5" min="0" value="' + d.normal + '"></div>'
      + '<div class="field"><label>Crash</label><input class="ed-low" type="number" step="0.5" min="0" value="' + d.low + '"></div>'
      + '<button class="btn-del" data-del="' + i + '">X</button>'
      + '</div>';
  }
  document.getElementById('drinks-editor').innerHTML = html;
}

function saveEdit() {
  var rows = document.querySelectorAll('#drinks-editor .edit-row');
  var newDrinks = [];
  for (var i = 0; i < rows.length; i++) {
    var idx = parseInt(rows[i].getAttribute('data-idx'));
    var origId = editDrinks[idx] ? editDrinks[idx].id : ('drink_' + Date.now() + '_' + i);
    newDrinks.push({
      id:     origId,
      name:   rows[i].querySelector('.ed-name').value,
      normal: parseFloat(rows[i].querySelector('.ed-normal').value) || 0,
      low:    parseFloat(rows[i].querySelector('.ed-low').value) || 0
    });
  }
  drinks = newDrinks;
  selected = {};
  crashed  = {};
  var prices = {};
  for (var j = 0; j < drinks.length; j++) prices[drinks[j].id] = drinks[j].normal;
  publish('prices', { drinks: drinks, prices: prices });
  renderList();
  updateBtn();
  closeEdit();
  toast('Boissons mises a jour !');
}

// Buttons
document.getElementById('btn-crash').addEventListener('click', doCrash);
document.getElementById('btn-recover').addEventListener('click', doRecover);
document.getElementById('btn-edit').addEventListener('click', openEdit);
document.getElementById('btn-cancel').addEventListener('click', closeEdit);
document.getElementById('btn-save-edit').addEventListener('click', saveEdit);
document.getElementById('btn-add-row').addEventListener('click', function() {
  editDrinks.push({ id: 'drink_' + Date.now(), name: 'Nouvelle boisson', normal: 4, low: 2 });
  renderEditor();
});

// Delete in editor
document.getElementById('drinks-editor').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-del]');
  if (!btn) return;
  var idx = parseInt(btn.getAttribute('data-del'));
  editDrinks.splice(idx, 1);
  renderEditor();
});

// Drink tap — delegation on parent
document.getElementById('drink-list').addEventListener('click', function(e) {
  var row = e.target.closest('[data-id]');
  if (row) toggleDrink(row.getAttribute('data-id'));
});
document.getElementById('drink-list').addEventListener('touchend', function(e) {
  e.preventDefault();
  var row = e.target.closest('[data-id]');
  if (row) toggleDrink(row.getAttribute('data-id'));
});

// Init
fetch('https://rest.ably.io/time')
  .then(function(r) { setConn(r.ok ? 'Connecte' : 'Erreur', r.ok ? 'ok' : 'err'); })
  .catch(function() { setConn('Pas de reseau', 'err'); });

renderList();
updateBtn();
</script>
