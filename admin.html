<title>Delirium — Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">

<style>
:root {
  --bg:     #0a0a0a;
  --surface:#111;
  --card:   #161616;
  --border: #252525;
  --fg:     #fff;
  --muted:  #555;
  --green:  #1db954;
  --red:    #ff3b3b;
  --gold:   #f5c842;
  --font-d: 'Bebas Neue', Impact, sans-serif;
  --font-b: 'Inter', system-ui, sans-serif;
  --font-m: 'JetBrains Mono', monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-b); }

header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.7em 1em;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--font-d); font-size: 1.8rem; letter-spacing: 0.2em; color: var(--green); }
.conn-status { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; }
.conn-status.ok   { color: var(--green); }
.conn-status.wait { color: var(--gold); }
.conn-status.err  { color: var(--red); }

.page { padding: 1em; display: flex; flex-direction: column; gap: 1.2em; max-width: 540px; margin: 0 auto; }
.section-title { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.6em; }

/* DRINK ROWS */
.drink-row {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.85em 1em; display: flex; align-items: center; gap: 0.8em;
  margin-bottom: 0.5em; cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.drink-row.selected {
  border-color: var(--red);
  background: rgba(255,59,59,0.08);
}
.drink-row.crashed {
  border-color: var(--red);
  background: rgba(255,59,59,0.15);
}
.dr-check {
  width: 22px; height: 22px; border-radius: 5px;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; transition: all 0.2s;
}
.drink-row.selected .dr-check {
  background: var(--red); border-color: var(--red); color: #fff;
}
.drink-row.crashed .dr-check {
  background: var(--red); border-color: var(--red); color: #fff;
}
.dr-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
.dr-prices { text-align: right; }
.dr-normal { font-family: var(--font-d); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
.dr-low { font-family: var(--font-m); font-size: 0.7rem; color: var(--red); margin-top: 2px; }
.dr-crashed-badge {
  font-family: var(--font-m); font-size: 0.65rem; letter-spacing: 0.05em;
  background: rgba(255,59,59,0.2); color: var(--red);
  padding: 0.15em 0.5em; border-radius: 4px; display: none;
}
.drink-row.crashed .dr-crashed-badge { display: inline-block; }

/* ACTION BUTTONS */
.action-zone { display: flex; flex-direction: column; gap: 0.7em; }
.btn-big {
  font-family: var(--font-d); letter-spacing: 0.1em;
  padding: 0.9em 1em; border: none; border-radius: 10px; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: flex; flex-direction: column; align-items: center; gap: 0.1em;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; width: 100%;
}
.btn-big:active { opacity: 0.7; transform: scale(0.98); }
.btn-big .label { font-size: 1.8rem; }
.btn-big small { font-size: 0.65rem; letter-spacing: 0.05em; font-family: var(--font-b); opacity: 0.75; }
.btn-crash   { background: var(--red);   color: #fff; }
.btn-recover { background: var(--green); color: #000; }
.btn-crash:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.select-hint {
  font-size: 0.75rem; color: var(--muted); text-align: center; padding: 0.5em 0;
}

/* EDIT MODAL */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-bg.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 1.3em; width: min(460px, 94vw); max-height: 85vh; overflow-y: auto;
}
.modal h2 { font-family: var(--font-d); font-size: 1.4rem; letter-spacing: 0.1em; color: var(--green); margin-bottom: 0.8em; }
.edit-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 0.4em; align-items: end; margin-bottom: 0.5em; }
.field label { display: block; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.25em; }
.field input {
  width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--fg);
  font-family: var(--font-m); font-size: 0.85rem; padding: 0.4em 0.6em; border-radius: 5px;
}
.field input:focus { outline: none; border-color: var(--green); }
.btn-del { background: none; border: none; color: var(--red); font-size: 1.1rem; cursor: pointer; padding: 0.4em; }
.btn-add { background: none; border: 1px dashed var(--border); color: var(--muted); width: 100%; padding: 0.5em; border-radius: 6px; cursor: pointer; margin: 0.4em 0 0.8em; font-size: 0.85rem; }
.btn-add:hover { border-color: var(--green); color: var(--green); }
.modal-footer { display: flex; gap: 0.6em; }
.btn-save { background: var(--green); color: #000; font-family: var(--font-d); font-size: 1rem; letter-spacing: 0.1em; padding: 0.55em 1.2em; border: none; border-radius: 6px; cursor: pointer; flex: 1; }
.btn-cancel { background: var(--border); color: var(--muted); font-family: var(--font-d); font-size: 1rem; letter-spacing: 0.1em; padding: 0.55em 1.2em; border: none; border-radius: 6px; cursor: pointer; }
.btn-edit { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--fg); font-family: var(--font-d); font-size: 1rem; letter-spacing: 0.1em; padding: 0.6em; border-radius: 8px; cursor: pointer; }
.btn-edit:hover { border-color: var(--muted); }

#toast {
  position: fixed; bottom: 1.5em; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border); color: var(--fg);
  font-size: 0.85rem; padding: 0.6em 1.2em; border-radius: 8px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
  z-index: 99;
}
#toast.show { opacity: 1; }
</style>

<header>
  <div class="logo">DELIRIUM</div>
  <div class="conn-status wait" id="conn-status">Connexion…</div>
</header>

<div class="page">

  <div>
    <div class="section-title">Sélectionne les boissons à crasher</div>
    <div id="drink-list"></div>
    <button class="btn-edit" onclick="openEdit()">✏️ Modifier les boissons et prix</button>
  </div>

  <div class="action-zone">
    <div class="select-hint" id="hint">Coche des boissons pour déclencher un crash</div>
    <button class="btn-big btn-crash" id="btn-crash" onclick="doCrash()" disabled>
      <span class="label">📉 DÉCLENCHER LE CRASH</span>
      <small id="crash-sub">Sélectionne des boissons d'abord</small>
    </button>
    <button class="btn-big btn-recover" onclick="doRecover()">
      <span class="label">📈 ENLEVER LE CRASH</span>
      <small>Remet tous les prix normaux</small>
    </button>
  </div>

</div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2>✏️ BOISSONS</h2>
    <div id="drinks-editor"></div>
    <button class="btn-add" onclick="addRow()">+ Ajouter une boisson</button>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEdit()">Annuler</button>
      <button class="btn-save" onclick="saveEdit()">✓ ENREGISTRER</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const ABLY_KEY = 'HWuUIA.eCUdiw:BcnMlAetft08risVQk6sAV5l9wgb2Bej5wmDgzOODp4';
const CHANNEL  = 'cashout-live';

let drinks = [
  { id:'beer25',   name:'Bière pression 25cl', normal:3.00, low:2.00 },
  { id:'beer50',   name:'Bière pression 50cl', normal:5.00, low:3.50 },
  { id:'shot',     name:'Shot simple',          normal:2.50, low:1.50 },
  { id:'shotprem', name:'Shot premium',         normal:3.50, low:2.50 },
  { id:'cocktail', name:'Cocktail classique',   normal:7.00, low:5.00 },
  { id:'cocksign', name:'Cocktail signature',   normal:9.50, low:7.00 },
  { id:'soft',     name:'Eau / Soda',           normal:2.00, low:1.50 },
  { id:'vodka',    name:'Vodka (70cl)',          normal:70.00,low:55.00 },
  { id:'champ',    name:'Champagne',            normal:60.00,low:45.00 },
];

// which drinks are selected for next crash, which are currently crashed
let selected = new Set();
let crashed  = new Set();

// ── ABLY via REST API (pas de librairie CDN) ──
const [ABLY_APP, ABLY_SECRET] = ABLY_KEY.split(':');

function setStatus(text, cls) {
  const el = document.getElementById('conn-status');
  el.textContent = text; el.className = 'conn-status ' + cls;
}

async function publish(event, data) {
  try {
    const body = JSON.stringify([{ name: 'event', data: { event, data } }]);
    const res = await fetch(
      `https://rest.ably.io/channels/${encodeURIComponent(CHANNEL)}/messages`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Basic ' + btoa(ABLY_KEY)
        },
        body
      }
    );
    if (res.ok) {
      setStatus('● Envoyé', 'ok');
      setTimeout(() => setStatus('● Connecté', 'ok'), 1500);
    } else {
      const t = await res.text();
      toast('⚠️ Erreur: ' + t);
      setStatus('✕ Erreur', 'err');
    }
  } catch(e) {
    toast('⚠️ ' + e.message);
    setStatus('✕ Erreur', 'err');
  }
}

function initAbly() {
  // Test connexion au démarrage
  fetch('https://rest.ably.io/time')
    .then(r => r.ok ? setStatus('● Connecté', 'ok') : setStatus('✕ Erreur', 'err'))
    .catch(() => setStatus('✕ Pas de réseau', 'err'));
}

// ── TOGGLE SELECTION ──
function toggleDrink(id) {
  if (crashed.has(id)) return; // already crashed, can't re-select
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  renderList();
  updateCrashBtn();
}

function updateCrashBtn() {
  const btn = document.getElementById('btn-crash');
  const sub = document.getElementById('crash-sub');
  const hint = document.getElementById('hint');
  const n = selected.size;
  if (n === 0) {
    btn.disabled = true;
    sub.textContent = 'Sélectionne des boissons d\'abord';
    hint.textContent = 'Coche des boissons pour déclencher un crash';
  } else {
    btn.disabled = false;
    sub.textContent = n === 1 ? '1 boisson sélectionnée' : n + ' boissons sélectionnées';
    hint.textContent = '';
  }
}

// ── CRASH ──
function doCrash() {
  if (selected.size === 0) return;
  const prices = {};
  // build full prices object: crashed drinks → low, others → normal
  drinks.forEach(d => {
    if (selected.has(d.id)) {
      prices[d.id] = d.low;
      crashed.add(d.id);
    } else {
      prices[d.id] = d.normal;
    }
  });
  selected.clear();
  publish('crash', { prices, crashedIds: [...crashed] });
  renderList();
  updateCrashBtn();
  toast('📉 Crash déclenché !');
}

// ── RECOVER ──
function doRecover() {
  crashed.clear();
  selected.clear();
  const prices = {};
  drinks.forEach(d => prices[d.id] = d.normal);
  publish('recover', { prices });
  renderList();
  updateCrashBtn();
  toast('📈 Prix normaux rétablis !');
}

// ── RENDER ──
function renderList() {
  document.getElementById('drink-list').innerHTML = drinks.map(d => {
    const isCrashed  = crashed.has(d.id);
    const isSelected = selected.has(d.id);
    const cls = isCrashed ? 'crashed' : isSelected ? 'selected' : '';
    const checkIcon = (isCrashed || isSelected) ? '✓' : '';
    return `<div class="drink-row ${cls}" onclick="toggleDrink('${d.id}')">
      <div class="dr-check">${checkIcon}</div>
      <div class="dr-name">${d.name}</div>
      <div class="dr-prices">
        <div class="dr-normal">${d.normal.toFixed(2)} €</div>
        <div class="dr-low">crash → ${d.low.toFixed(2)} €</div>
        <div class="dr-crashed-badge">EN CRASH</div>
      </div>
    </div>`;
  }).join('');
}

// ── EDIT ──
let editDrinks = [];
function openEdit() {
  editDrinks = JSON.parse(JSON.stringify(drinks));
  renderEditor();
  document.getElementById('modal-bg').classList.add('show');
}
function closeEdit() { document.getElementById('modal-bg').classList.remove('show'); }
function renderEditor() {
  document.getElementById('drinks-editor').innerHTML = editDrinks.map((d, i) => `
    <div class="edit-row">
      <div class="field"><label>Nom</label><input value="${d.name}" oninput="editDrinks[${i}].name=this.value"></div>
      <div class="field"><label>Normal €</label><input type="number" step="0.5" min="0" value="${d.normal}" oninput="editDrinks[${i}].normal=+this.value"></div>
      <div class="field"><label>Crash €</label><input type="number" step="0.5" min="0" value="${d.low}" oninput="editDrinks[${i}].low=+this.value"></div>
      <button class="btn-del" onclick="editDrinks.splice(${i},1);renderEditor()">✕</button>
    </div>`).join('');
}
function addRow() {
  editDrinks.push({ id:'drink_'+Date.now(), name:'Nouvelle boisson', normal:4, low:2 });
  renderEditor();
}
function saveEdit() {
  drinks = editDrinks.map((d,i) => ({ ...d, id: d.id||'drink_'+i }));
  selected.clear(); crashed.clear();
  const prices = {};
  drinks.forEach(d => prices[d.id] = d.normal);
  publish('prices', { drinks, prices });
  renderList();
  updateCrashBtn();
  closeEdit();
  toast('✓ Boissons mises à jour !');
}

// ── TOAST ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── INIT ──
renderList();
updateCrashBtn();
initAbly();
</script>
